[package]
name = "plcom"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = "0.5"
leptos = { version = "0.8", features = ["ssr"] }
jiff = "0.2"
rocket_async_compression = "0.6"
nanorand = { version = "0.7", features = ["chacha"] }
tailwind_fuse = { version = "0.3", features = ["variant"] }

[build-dependencies]
serde = "1.0"
serde_json = "1.0"
