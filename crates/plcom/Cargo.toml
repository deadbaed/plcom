[package]
name = "plcom"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = "0.5"
leptos = {version = "0.7.0-rc1" , features = ["ssr"]}
jiff = "0.1"
rocket_async_compression = "0.6"
nanorand = { version = "0.7", features = ["chacha"] }
tailwind_fuse = { version = "0.3", features = ["variant"] }

[build-dependencies]
serde = { workspace = true }
serde_json = "1.0"

